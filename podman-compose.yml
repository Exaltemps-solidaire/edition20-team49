name: team49
networks:
  core-network:
    external: true
services:
  frontend:
    image: localhost:5000/team49/frontend:dev
    networks: [core-network]
    ports: ["8080:80"]
  api:
    image: localhost:5000/team49/api:dev
    networks: [core-network]
    ports: ["8081:8081"]
    environment:
      PORT: 8081
